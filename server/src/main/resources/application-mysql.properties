# ============================================================
# MySQL profile：连接真实 MySQL 数据库
# 使用方式：
#   1. 创建库 hisdb（须与下方 JDBC URL 库名一致），导入 schema.sql / data.sql
#   2. 修改下面的账号密码
#   3. 启动时加参数 --spring.profiles.active=mysql
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hisdb?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# 真实库已由 SQL 文件建好，不再自动初始化
spring.sql.init.mode=never
spring.h2.console.enabled=false

mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=DelMark
mybatis-plus.global-config.db-config.logic-delete-value=0
mybatis-plus.global-config.db-config.logic-not-delete-value=1

his.jwt.secretkey=hiscloud
