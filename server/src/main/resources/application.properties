server.port=8081
spring.application.name=his-cloud-server

# ============================================================
# 默认 profile：H2 内存库（开箱即用，无需安装 MySQL）
# 启动时自动执行 schema.sql 建表 + data.sql 灌入种子数据
# ============================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:hisdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MyBatis-Plus ----------
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=DelMark
mybatis-plus.global-config.db-config.logic-delete-value=0
mybatis-plus.global-config.db-config.logic-not-delete-value=1

# ---------- JWT ----------
his.jwt.secretkey=hiscloud

# ---------- 日志 ----------
logging.level.root=info
logging.level.com.neuedu.his=debug
